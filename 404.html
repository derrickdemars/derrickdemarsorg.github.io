<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<script>window.HUB_LAUNCH=true;</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>@view-transition{navigation:auto;}</style>
<script src="hub-state.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Page not found | Dr. DeMars | Math Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/opendyslexic">
<script src="hub-state.js"></script>
<style>
:root{--bg:#131317;--surface:#1c1c22;--surface2:#27272f;--line:#33333c;--ink:#f3f2ee;--muted:#b6b5bf;--font:"Helvetica Neue",Helvetica,Arial,sans-serif;--lh:1.5;--ls:0;--lift:-3px;--dur:160ms;--tileborder:0px solid transparent;--grow:1.02;--fade:300ms;--shape-hover:0.34;--glow:0 0 0 1px rgba(255,255,255,0.12),0 0 20px rgba(255,255,255,0.12);--t-g7:oklch(0.86 0.12 150);--t-g8:oklch(0.84 0.09 250);--t-alg1:oklch(0.86 0.11 60);--t-geo:oklch(0.83 0.1 300);--t-alg2:oklch(0.83 0.1 25);--t-alg3:oklch(0.92 0.12 95);color-scheme:dark;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:var(--lh);letter-spacing:var(--ls);}
a{color:var(--ink);}
a:hover{color:var(--ink);}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
a:focus-visible,button:focus-visible{box-shadow:var(--glow);}
@keyframes hubfade{from{opacity:0}to{opacity:1}}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--vt,280ms);animation-timing-function:cubic-bezier(0.45,0,0.55,1);}
::view-transition-group(site-header){animation-duration:0s;}
button,textarea,input{font:inherit;letter-spacing:inherit;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font);">
  <dc-import name="Site Header" active="none" hint-size="100%,76px" style="position:sticky;top:0;z-index:50;display:block;"></dc-import>
  <main id="main" tabindex="-1" style="animation:hubfade var(--fade) ease both;flex:1;width:100%;max-width:880px;margin:0 auto;box-sizing:border-box;padding:56px clamp(16px,4vw,48px) 72px;display:flex;flex-direction:column;gap:28px;outline:none;">
    <div style="display:flex;flex-direction:column;gap:10px;">
      <h1 style="margin:0;font-size:clamp(34px,5vw,46px);line-height:1.1;">Page not found</h1>
      <p style="margin:0;font-size:20px;color:var(--muted);text-wrap:pretty;">This page may have moved.</p>
    </div>
    <a href="./" style="align-self:flex-start;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 24px;border-radius:16px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-size:19px;font-weight:700;text-decoration:none;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--glow);"><span class="material-symbols-rounded" aria-hidden="true">home</span>Go to Home</a>
    <section aria-labelledby="nf-courses" style="display:flex;flex-direction:column;gap:12px;">
      <h2 id="nf-courses" style="margin:0;font-size:22px;">Courses</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px;">
        <sc-for list="{{ courses }}" as="c" hint-placeholder-count="6">
          <a href="{{ c.href }}" style="display:flex;align-items:center;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:{{ c.color }};font-size:18px;font-weight:700;text-decoration:none;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--glow);">{{ c.name }}</a>
        </sc-for>
      </div>
    </section>
  </main>
  <dc-import name="Site Footer" hint-size="100%,110px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CS_MAP = {g7:'courses/grade-7/',g8:'courses/grade-8/',alg1:'courses/algebra-i/',geo:'courses/geometry/',alg2:'courses/algebra-ii/',alg3:'courses/algebra-iii/',feud:'games/family-feud/',jeopardy:'games/jeopardy/',planner:'planner/'};
const NF_COURSES = [['g7','7th Grade Math'],['g8','8th Grade Math'],['alg1','Algebra I'],['geo','Geometry'],['alg2','Algebra II'],['alg3','Algebra III']];
class Component extends DCLogic {
  renderVals(){
    return { courses: NF_COURSES.map(([id, name]) => ({ name, href: CS_MAP[id], color: `var(--t-${id})` })) };
  }
}
</script>
</body>
</html>
