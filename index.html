<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<script>window.HUB_LAUNCH=true;</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>@view-transition{navigation:auto;}</style>
<script src="hub-state.js"></script>
<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "za02jiv9ma");</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Classes &amp; Calendar | Dr. DeMars | Math Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/opendyslexic">
<script src="hub-state.js"></script>
<script src="calendar-data.js?v=5"></script>
<script src="classroom-feed.js?v=3"></script>
<script src="bell-schedule.js"></script>
<script src="quick-links.js?v=4"></script>
<style>
:root{--bg:#131317;--surface:#1c1c22;--surface2:#27272f;--line:#33333c;--ink:#f3f2ee;--muted:#b6b5bf;--font:"Helvetica Neue",Helvetica,Arial,sans-serif;--lh:1.5;--ls:0;--lift:-3px;--dur:160ms;--tileborder:0px solid transparent;--grow:1.02;--fade:300ms;--shape-hover:0.34;--glow:0 0 0 1px rgba(255,255,255,0.12),0 0 20px rgba(255,255,255,0.12);--cg-geo:var(--glow);--cg-alg1:var(--glow);--cg-alg2:var(--glow);--cg-alg3:var(--glow);--cg-g7:var(--glow);--cg-g8:var(--glow);--t-g7:oklch(0.86 0.12 150);--t-g8:oklch(0.84 0.09 250);--t-alg1:oklch(0.86 0.11 60);--t-geo:oklch(0.83 0.1 300);--t-alg2:oklch(0.83 0.1 25);--t-alg3:oklch(0.92 0.12 95);color-scheme:dark;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:var(--lh);letter-spacing:var(--ls);}
a{color:var(--ink);}
a:hover{color:var(--ink);}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
a:focus-visible,button:focus-visible{box-shadow:var(--glow);}
@keyframes hubfade{from{opacity:0}to{opacity:1}}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--vt,280ms);animation-timing-function:cubic-bezier(0.45,0,0.55,1);}
::view-transition-group(site-header){animation-duration:0s;}
button,textarea,input{font:inherit;letter-spacing:inherit;}
/* Course tiles: icon on top, name, then time. By default the name sits just above the time. */
.hub-tile{min-height:200px;}
.hub-tile-icon{width:80px;height:80px;font-size:44px;margin-bottom:24px;}
.hub-tile-name{font-size:28px;padding-right:40px;margin-top:auto;}
.hub-tile-time{margin-top:4px;}
/* Quick Links panel and its rows. */
.hub-links{flex:1 1 280px;gap:10px;}
.hub-link{min-height:52px;padding:6px 12px;font-size:17px;}
.hub-link-desc{font-size:14px;}
/* 3-column layout with Quick Links beside it. The tile column has room for 3 tiles (726px) once the
   content area is 1038.13px wide, so this rule starts there.
   Tiles are only as tall as their content, and they size to the screen so both rows show when the
   page opens: the icon grows with the screen's height from 56px to 96px, and the course name grows
   with it from 22px, capped by the tile's width (4.22cqi - 21.9px) so it stays on one line in the
   regular font. (OpenDyslexic is wider, so names may still wrap in that mode.)
   Quick Links stretches to the height of the tile column so the two bottoms line up; its rows share
   any extra height evenly. */
@container (min-width:1038.15px){
  .hub-classes{align-self:flex-start;}
  .hub-tiles{--hv:0px;}
  .hub-tile{min-height:0;}
  .hub-tile-icon{--i:clamp(56px,calc(38.8vh - 176px - var(--hv)),96px);width:var(--i);height:var(--i);font-size:calc(var(--i) * 0.55);margin-bottom:0;}
  .hub-tile-name{font-size:clamp(22px,min(calc(9.7vh - 36px - var(--hv) / 4),calc(4.22cqi - 21.9px)),32px);padding-right:0;margin-block:auto;padding-block:12px;}
  .hub-tile-time{margin-top:0;}
  .hub-links{align-self:stretch;gap:8px;}
  .hub-link{flex:1 0 auto;min-height:0;font-size:16px;}
  .hub-link-desc{font-size:13px;}
}
/* Narrow 3-column windows: the class time wraps to two lines here, so the icon gives back that height. */
@container (min-width:1038.15px) and (max-width:1124px){
  .hub-tiles{--hv:20px;}
}
/* Widen Quick Links a little once there is room for it beside 3 tiles. */
@container (min-width:1054.15px){
  .hub-links{flex-basis:296px;}
}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font);">
  <a href="./#main" style="position:absolute;left:16px;top:-120px;z-index:200;padding:14px 20px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:700;text-decoration:none;" style-focus="top:16px;">Skip to main content</a>
  <dc-import name="Site Header" active="home" hint-size="100%,76px" style="position:sticky;top:0;z-index:50;display:block;"></dc-import>
  <main id="main" tabindex="-1" style="container-type:inline-size;animation:hubfade var(--fade) ease both;flex:1;width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:40px clamp(16px,4vw,48px) 72px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;outline:none;">
    <div class="hub-classes" style="flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:28px;">
      <h1 style="margin:0;font-size:clamp(34px,5vw,46px);line-height:1.1;">Classes &amp; Calendar</h1>
      <div class="hub-tiles" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:18px;">
        <sc-for list="{{ courses }}" as="c" hint-placeholder-count="6">
          <a class="hub-tile" href="{{ c.href }}" style="--tile-glow:{{ c.glowVar }};position:relative;overflow:hidden;background:var(--surface);color:var(--ink);text-decoration:none;border:2px solid {{ c.borderColor }};box-shadow:{{ c.ring }};border-radius:28px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--tile-glow);--shape-op:var(--shape-hover);" style-active="box-shadow:var(--tile-glow);--shape-op:var(--shape-hover);">
            <span aria-hidden="true" style="position:absolute;right:-28px;top:-28px;width:120px;height:120px;border-radius:{{ c.radius }};background:{{ c.fill }};opacity:var(--shape-op,0.22);transition:opacity var(--dur) ease;"></span>
            <sc-if value="{{ c.hasTag }}"><span style="position:absolute;top:18px;right:18px;z-index:1;display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;"><span class="material-symbols-rounded" aria-hidden="true" style="font-size:16px;">{{ c.tagIcon }}</span>{{ c.tag }}</span></sc-if>
            <span class="material-symbols-rounded hub-tile-icon" aria-hidden="true" style="position:relative;flex:none;border-radius:{{ c.radius }};background:{{ c.fill }};color:#15151a;display:grid;place-items:center;">{{ c.icon }}</span>
            <span class="hub-tile-name" style="position:relative;display:block;font-weight:700;line-height:1.15;color:{{ c.textVar }};">{{ c.name }}</span>
            <span class="hub-tile-time" style="position:relative;display:flex;align-items:center;gap:6px;padding-right:40px;font-size:17px;color:var(--muted);"><span class="material-symbols-rounded" aria-hidden="true" style="font-size:18px;">schedule</span>{{ c.time }}<span class="material-symbols-rounded" aria-hidden="true" style="position:absolute;right:0;bottom:0;font-size:28px;color:var(--muted);">arrow_forward</span></span>
          </a>
        </sc-for>
      </div>
    </div>
    <aside class="hub-links" aria-label="Quick links" style="display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-sizing:border-box;">
      <h2 style="margin:0 0 6px;font-size:22px;">Quick Links</h2>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a class="hub-link" href="{{ l.url }}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;border-radius:14px;background:var(--surface2);color:var(--ink);text-decoration:none;font-weight:700;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--glow);" style-active="box-shadow:var(--glow);">
          <span class="material-symbols-rounded" aria-hidden="true">{{ l.icon }}</span>
          <span style="flex:1;">{{ l.name }}<span class="hub-link-desc" style="display:block;font-weight:400;color:var(--muted);">{{ l.desc }}</span></span>
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size:20px;color:var(--muted);">open_in_new</span>
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">(opens in a new tab)</span>
        </a>
      </sc-for>
    </aside>
    <section id="calendar" aria-labelledby="cal-title" style="flex:1 1 100%;min-width:0;margin-top:clamp(4px,2vw,16px);scroll-margin-top:96px;display:flex;flex-direction:column;gap:14px;">
        {{ calView }}
      </section>
  </main>
  <dc-import name="Site Footer" hint-size="100%,110px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CS_MAP = {g7:'courses/grade-7/',g8:'courses/grade-8/',alg1:'courses/algebra-i/',geo:'courses/geometry/',alg2:'courses/algebra-ii/',alg3:'courses/algebra-iii/',feud:'games/family-feud/',jeopardy:'games/jeopardy/',planner:'planner/'};
const COURSES = [
  {id:'geo', name:'Geometry', level:'High school', icon:'architecture', fill:'oklch(0.67 0.19 300)', radius:'50%'},
  {id:'alg1', name:'Algebra I', level:'High school', icon:'calculate', fill:'oklch(0.76 0.16 55)', radius:'24px'},
  {id:'alg3', name:'Algebra III', level:'High school', icon:'ssid_chart', fill:'oklch(0.88 0.16 95)', radius:'50%'},
  {id:'g7', name:'7th Grade Math', level:'Middle school', icon:'square_foot', fill:'oklch(0.74 0.17 150)', radius:'24px'},
  {id:'g8', name:'8th Grade Math', level:'Middle school', icon:'straighten', fill:'oklch(0.69 0.15 250)', radius:'50%'},
  {id:'alg2', name:'Algebra II', level:'High school', icon:'show_chart', fill:'oklch(0.67 0.2 25)', radius:'24px'}
];
class Component extends DCLogic {
  syncPhone(){ const on = !!this.props.phone; if (on !== this.lastPhone && window.HubState && window.HubState.setPhonePreview){ this.lastPhone = on; window.HubState.setPhonePreview(on); } }
  componentDidUpdate(){ this.syncPhone(); }
  componentDidMount(){ this.syncPhone(); this.onCal = () => this.forceUpdate(); window.addEventListener('hubcal-ready', this.onCal); window.addEventListener('hubbell-ready', this.onCal); window.addEventListener('hublinks-ready', this.onCal); this.tick = setInterval(this.onCal, 30000); }
  componentWillUnmount(){ window.removeEventListener('hubcal-ready', this.onCal); window.removeEventListener('hubbell-ready', this.onCal); window.removeEventListener('hublinks-ready', this.onCal); clearInterval(this.tick); }
  renderVals(){
    const bell = window.HubBell, st = bell ? bell.status() : {now:null, next:null};
    return {
      calView: window.HubCalendar && window.HubCalendar.element ? window.HubCalendar.element({mode: 'home'}) : null,
      courses: COURSES.map(c => {
        const isNow = st.now === c.id, isNext = !!(st.next && st.next.c === c.id);
        return {...c, href: CS_MAP[c.id], textVar: `var(--t-${c.id})`, glowVar: `var(--cg-${c.id})`,
          time: bell ? bell.timeFor(c.id) : '',
          hasTag: isNow || isNext, tag: isNow ? 'Now' : isNext ? `Next · ${st.next.at}` : '', tagIcon: isNow ? 'radio_button_checked' : 'schedule',
          borderColor: isNow ? c.fill : 'var(--line)', ring: isNow ? `0 0 0 2px ${c.fill}` : 'none'};
      }),
      links: window.HubLinks ? window.HubLinks.forHome() : []
    };
  }
}
</script>
</body>
</html>
