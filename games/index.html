<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<script>window.HUB_LAUNCH=true;</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>@view-transition{navigation:auto;}</style>
<script src="hub-state.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Games | Dr. DeMars | Math Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/opendyslexic">
<script src="hub-state.js"></script>
<style>
:root{--bg:#131317;--surface:#1c1c22;--surface2:#27272f;--line:#33333c;--ink:#f3f2ee;--muted:#b6b5bf;--font:"Helvetica Neue",Helvetica,Arial,sans-serif;--lh:1.5;--ls:0;--lift:-3px;--dur:160ms;--tileborder:0px solid transparent;--grow:1.02;--fade:300ms;--shape-hover:0.34;--glow:0 0 0 1px rgba(255,255,255,0.12),0 0 20px rgba(255,255,255,0.12);--cg-geo:var(--glow);--cg-alg1:var(--glow);--cg-alg2:var(--glow);--cg-alg3:var(--glow);--cg-g7:var(--glow);--cg-g8:var(--glow);--t-g7:oklch(0.86 0.12 150);--t-g8:oklch(0.84 0.09 250);--t-alg1:oklch(0.86 0.11 60);--t-geo:oklch(0.83 0.1 300);--t-alg2:oklch(0.83 0.1 25);--t-alg3:oklch(0.92 0.12 95);color-scheme:dark;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:var(--lh);letter-spacing:var(--ls);}
a{color:var(--ink);}
a:hover{color:var(--ink);}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
a:focus-visible,button:focus-visible{box-shadow:var(--glow);}
@keyframes hubfade{from{opacity:0}to{opacity:1}}
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--vt,280ms);animation-timing-function:cubic-bezier(0.45,0,0.55,1);}
::view-transition-group(site-header){animation-duration:0s;}
button,textarea,input{font:inherit;letter-spacing:inherit;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font);">
  <a href="games/#main" style="position:absolute;left:16px;top:-120px;z-index:200;padding:14px 20px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:700;text-decoration:none;" style-focus="top:16px;">Skip to main content</a>
  <dc-import name="Site Header" active="games" hint-size="100%,76px" style="position:sticky;top:0;z-index:50;display:block;"></dc-import>
  <main id="main" tabindex="-1" style="animation:hubfade var(--fade) ease both;flex:1;width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:28px clamp(16px,4vw,48px) 72px;display:flex;flex-direction:column;gap:32px;outline:none;">

    <sc-if value="{{ locked }}">
      <div style="width:520px;max-width:100%;box-sizing:border-box;margin:24px auto 0;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:16px;">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size:44px;">lock</span>
        <h1 style="margin:0;font-size:36px;line-height:1.15;">Games</h1>
        <p style="margin:0;font-size:19px;color:var(--muted);text-wrap:pretty;">Sign in with your PIN to open Games.</p>
        <button onClick="{{ signIn }}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-size:18px;font-weight:700;cursor:pointer;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--glow);" style-active="box-shadow:var(--glow);"><span class="material-symbols-rounded" aria-hidden="true">dialpad</span>Sign in with PIN</button>
      </div>
    </sc-if>

    <sc-if value="{{ unlocked }}">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <h1 style="margin:0;font-size:clamp(34px,5vw,46px);line-height:1.1;">Games</h1>
        <p style="margin:0;font-size:19px;color:var(--muted);">Each game opens on its own page.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:20px;align-items:stretch;">
        <sc-for list="{{ games }}" as="g" hint-placeholder-count="2">
          <div style="background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:18px;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--glow);" style-active="box-shadow:var(--glow);">
            <span class="material-symbols-rounded" aria-hidden="true" style="width:72px;height:72px;border-radius:22px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:42px;">{{ g.icon }}</span>
            <h2 style="margin:0;font-size:30px;line-height:1.15;">{{ g.name }}</h2>
            <div style="flex:1;">
              <div style="font-size:15px;font-weight:700;color:var(--muted);">How to play</div>
              <p style="margin:4px 0 0;font-size:18px;text-wrap:pretty;">{{ g.how }}</p>
            </div>
            <a href="{{ g.href }}" target="{{ g.target }}" rel="{{ g.rel }}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-size:18px;font-weight:700;text-decoration:none;transition:transform var(--dur) ease,box-shadow var(--dur) ease;" style-hover="transform:translateY(var(--lift)) scale(var(--grow));box-shadow:var(--glow);" style-active="box-shadow:var(--glow);"><span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>Play {{ g.name }}</a>
          </div>
        </sc-for>
        <div style="border:2px dashed var(--line);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:center;min-height:240px;">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size:40px;color:var(--muted);">add_circle</span>
          <h2 style="margin:0;font-size:26px;">More games soon</h2>
          <p style="margin:0;font-size:18px;color:var(--muted);">New game types will each get their own page.</p>
        </div>
      </div>
    </sc-if>
  </main>
  <dc-import name="Site Footer" hint-size="100%,110px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const GAMES = [
  {name:'Jeopardy', icon:'grid_view', page:'jeopardy', href:'games/jeopardy/', how:'Teams take turns picking a category and a point value. Answer the question correctly to earn the points. The team with the most points at the end wins.'},
  {name:'Family Feud', icon:'groups', page:'feud', how:'Two teams guess the most popular answers to a survey question. Each correct answer earns points. Find every answer on the board to win the round.'}
];
class Component extends DCLogic {
  state = { teacher: !!(window.HubState && window.HubState.get().teacher) };
  componentDidMount(){
    this.onHub = () => { if (window.HubState) { const v = window.HubState.get(); this.setState({teacher: !!v.teacher, signedIn: !!v.signedIn, role: v.role}); } };
    window.addEventListener('hubchange', this.onHub);
    window.addEventListener('hubstate-ready', this.onHub);
    this.onHub();
  }
  componentWillUnmount(){
    window.removeEventListener('hubchange', this.onHub);
    window.removeEventListener('hubstate-ready', this.onHub);
  }
  renderVals(){
    const t = !!this.state.signedIn;
    return {
      locked: !t, unlocked: t,
      signIn: () => window.HubState && window.HubState.openSignin(),
      games: GAMES.map(g => { const nt = !!g.href && /(^|\.)derrickdemars\.org$|^localhost$|^127\.0\.0\.1$|^$/.test(location.hostname); return {...g, href: g.href || ({g7:'courses/grade-7/',g8:'courses/grade-8/',alg1:'courses/algebra-i/',geo:'courses/geometry/',alg2:'courses/algebra-ii/',alg3:'courses/algebra-iii/',feud:'games/family-feud/',jeopardy:'games/jeopardy/',planner:'planner/'}[g.page]), target: nt ? '_blank' : undefined, rel: nt ? 'opener' : undefined}; })
    };
  }
}
</script>
</body>
</html>
